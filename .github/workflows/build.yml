name: Build

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  # Native runner per architecture (no QEMU); the image is smoke-tested on each.
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Check Python sources compile
        run: python3 -m compileall -q colab_link jobs tools examples probe

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: colab-link:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Smoke test
        run: |
          docker run --rm colab-link:ci profiles
          docker run --rm --entrypoint colab colab-link:ci --help > /dev/null
