services:
  colab-link:
    image: flarexio/colab-link
    build: .
    restart: unless-stopped
    environment:
      # GCP project with the Drive API enabled (put it in .env next to this file)
      COLAB_LINK_DRIVE_PROJECT: ${COLAB_LINK_DRIVE_PROJECT:?set COLAB_LINK_DRIVE_PROJECT}
    volumes:
      - ~/.flarex/colab-link:/root/.flarex/colab-link:ro   # id + user.creds (FlareX edge)
      - ~/.config/colab-cli:/root/.config/colab-cli        # colab CLI OAuth token (refreshed in place)
      - colab-link-state:/data                             # per-VM CLI state, to stop VMs after a restart
    stop_grace_period: 2m   # SIGTERM stops every warm VM before exit

  # HTTP API: uploads go to Drive, jobs to the service over NATS; also the
  # OpenAI-compatible /v1 routes. Put TLS in front of it (reverse proxy).
  api:
    image: flarexio/colab-link
    restart: unless-stopped
    command: ["api", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      COLAB_LINK_DRIVE_PROJECT: ${COLAB_LINK_DRIVE_PROJECT:?set COLAB_LINK_DRIVE_PROJECT}
      COLAB_LINK_API_KEY: ${COLAB_LINK_API_KEY:?set COLAB_LINK_API_KEY}
      COLAB_LINK_API_DATA: /data/api   # collected job outputs, kept 2 days
    volumes:
      - ~/.flarex/colab-link:/root/.flarex/colab-link:ro
      - ~/.config/colab-cli:/root/.config/colab-cli
      - colab-link-state:/data

  # Stops any Colab session on the account that nobody supervises or leases
  # (see colab_link/guard.py). Separate from the service so it keeps working
  # when the service is down. Run it on one machine only.
  reaper:
    image: flarexio/colab-link
    restart: unless-stopped
    command: ["reap", "--loop", "300"]
    environment:
      COLAB_LINK_GUARD: /data/guard
    volumes:
      - ~/.flarex/colab-link:/root/.flarex/colab-link:ro
      - ~/.config/colab-cli:/root/.config/colab-cli
      - colab-link-state:/data

volumes:
  colab-link-state:
